name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test_Pass123!"
        ports: ["1433:1433"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Esperar SQL Server
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/1433) 2>/dev/null && break
            sleep 2
          done
          sleep 10
      - name: Pruebas
        env:
          SQLSYNC_TEST_SERVER: localhost
          SQLSYNC_TEST_USER: sa
          SQLSYNC_TEST_PASSWORD: "Test_Pass123!"
        run: dotnet test tests/SqlTableSync.Tests -c Release

  installer:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compilar instalador
        id: build
        shell: pwsh
        run: |
          $v = "1.1.0"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          ./build.ps1 -Version $v
          "version=$v" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: SqlTableSync-windows
          path: dist/*
      # Publica el instalador como "Release": queda un link de descarga directa en
      # https://github.com/<usuario>/<repo>/releases/latest
      - name: Publicar release
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref_name == 'claude/sql-table-comparator-brr4qb')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SqlTableSync ${{ steps.build.outputs.version }}
          body: |
            Descargue **SqlTableSync-Setup-${{ steps.build.outputs.version }}.exe** y ejecútelo (Windows 10/11 de 64 bits).
            No requiere permisos de administrador ni tener .NET instalado.
            El archivo `-portable.zip` es la versión sin instalación.
          make_latest: true
          files: dist/*
